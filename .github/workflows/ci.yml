name: CI

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Run tests
        run: cargo test
      - name: Build release
        run: cargo build --release

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run Benchmarks
        run: cargo run --release --example benchmark

  stress-test:
    name: Stress & Resilience Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install wrk
        run: sudo apt-get update && sudo apt-get install -y wrk
      - name: Build release
        run: cargo build --release
      - name: Generate Certificates
        run: chmod +x scripts/*.sh && ./scripts/generate_certs.sh
      - name: Run Randomized Stress Test
        run: ./scripts/ci_stress_test.sh

