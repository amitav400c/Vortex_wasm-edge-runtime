[package]
name = "vortex-core"
version = "0.1.0"
edition = "2021"
description = "High-performance, thread-per-core WebAssembly runtime built with io_uring, glommio, and Wasmtime."
authors = ["Amitava Bose <amitavaformaingearrush@gmail.com>"]
license = "MIT"
repository = "https://github.com/yourusername/vortex"
keywords = ["wasm", "runtime", "high-performance", "io_uring", "glommio"]
categories = ["wasm", "network-programming", "asynchronous"]

[dependencies]
glommio = "0.8"
futures-lite = "1.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
futures-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pemfile = "2.1"
rustls-pki-types = "1.7"
anyhow = "1.0"
num_cpus = "1.17.0"
httparse = "1.10.1"
wasmtime = "21.0.1" # Using an older version compatible with wasmtime-wasi 21
wasmtime-wasi = "21.0.1"
arc-swap = "1.7.1"
aya = { git = "https://github.com/aya-rs/aya", branch = "main", optional = true }
aya-log = { git = "https://github.com/aya-rs/aya", branch = "main", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.0", features = ["derive"] }

[features]
simd = []
bpf = ["dep:aya", "dep:aya-log"]

[dev-dependencies]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
